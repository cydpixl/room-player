<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#111113">
  <title>Room Player</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./player.js"></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="screen" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="play" viewBox="0 0 24 24"><path d="M8 5.5v13a.8.8 0 0 0 1.2.7l10-6.5a.8.8 0 0 0 0-1.4l-10-6.5a.8.8 0 0 0-1.2.7z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="pause" viewBox="0 0 24 24"><path d="M9 6v12m6-12v12" stroke-width="3"/></symbol>
    <symbol id="back" viewBox="0 0 24 24"><path d="M3 4v6h6M4 9a8 8 0 1 1 .3 7.5"/><path d="M9.5 12H11v5m3.5-5h2v5h-2z" stroke-width="1.15"/></symbol>
    <symbol id="forward" viewBox="0 0 24 24"><path d="M21 4v6h-6m5-1a8 8 0 1 0-.3 7.5"/><path d="M8.5 12H10v5m3.5-5h2v5h-2z" stroke-width="1.15"/></symbol>
    <symbol id="expand" viewBox="0 0 24 24"><path d="M4 9V4h5m6 0h5v5m0 6v5h-5m-6 0H4v-5"/></symbol>
    <symbol id="minimize" viewBox="0 0 24 24"><path d="M4 9h5V4m6 0v5h5m0 6h-5v5m-6 0v-5H4"/></symbol>
    <symbol id="cc" viewBox="0 0 24 24"><rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/><path d="M10 10a2.5 2.5 0 1 0 0 4m7-4a2.5 2.5 0 1 0 0 4"/></symbol>
    <symbol id="volume" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9zm13 0a4 4 0 0 1 0 6m2-9a8 8 0 0 1 0 12"/></symbol>
    <symbol id="muted" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9zm13 1 5 5m0-5-5 5"/></symbol>
    <symbol id="copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 4H6a2 2 0 0 0-2 2v10"/></symbol>
    <symbol id="upload" viewBox="0 0 24 24"><path d="M12 15V4m-4 4 4-4 4 4M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></symbol>
  </svg>

  <main class="lobby" id="lobby">
    <form id="joinForm" autocomplete="off">
      <div class="mark"><svg aria-hidden="true"><use href="#screen"/></svg></div>
      <h1><label for="code">Room code</label></h1>
      <input id="code" type="text" maxlength="12" placeholder="Enter code" autocapitalize="characters" spellcheck="false" required>
      <button class="primary" type="submit">Join room</button>
      <button class="secondary" id="host" type="button">Host room</button>
      <p class="message" id="lobbyMessage" role="status" hidden></p>
    </form>
  </main>

  <main id="room" class="room" hidden>
    <header class="room-header">
      <a class="home" href="./" aria-label="Leave room" title="Leave room"><svg aria-hidden="true"><use href="#screen"/></svg></a>
      <div class="room-code">
        <span>Room code</span>
        <button id="copy" class="copy" type="button" title="Copy room code" aria-label="Copy room code"><code id="roomCode"></code><svg aria-hidden="true"><use href="#copy"/></svg></button>
      </div>
      <button class="text-button" id="leave" type="button">Leave</button>
    </header>

    <section class="player" id="player" aria-label="Film player">
      <div class="picture" id="picture">
        <video id="video" playsinline preload="auto" crossorigin="anonymous" disablepictureinpicture></video>
        <div class="empty" id="empty">
          <svg aria-hidden="true"><use href="#screen"/></svg>
          <span id="emptyLabel">Waiting for film</span>
        </div>
        <span class="notice" role="status" id="playerMessage" hidden></span>
        <button id="enablePlayback" class="center-play" type="button" aria-label="Start playback on this device" hidden><svg aria-hidden="true"><use href="#play"/></svg></button>
      </div>
      <div class="controls">
        <input id="seek" type="range" min="0" max="1" value="0" step="0.01" aria-label="Seek" disabled>
        <div class="transport">
          <button class="icon play" id="playToggle" type="button" title="Play" aria-label="Play" disabled><svg aria-hidden="true"><use href="#play"/></svg></button>
          <button class="icon" id="skipBack" type="button" title="Back 10 seconds" aria-label="Back 10 seconds" disabled><svg aria-hidden="true"><use href="#back"/></svg></button>
          <button class="icon" id="skipForward" type="button" title="Forward 10 seconds" aria-label="Forward 10 seconds" disabled><svg aria-hidden="true"><use href="#forward"/></svg></button>
          <span class="time"><span id="elapsed">0:00</span><span class="divider"> / </span><span id="duration">0:00</span></span>
          <span class="spacer"></span>
          <button class="icon" id="mute" type="button" title="Mute" aria-label="Mute" aria-pressed="false"><svg aria-hidden="true"><use href="#volume"/></svg></button>
          <button class="icon" id="captions" type="button" title="Captions" aria-label="Captions" aria-pressed="false" disabled><svg aria-hidden="true"><use href="#cc"/></svg></button>
          <button class="icon" id="fullscreen" type="button" title="Full screen" aria-label="Full screen"><svg aria-hidden="true"><use href="#expand"/></svg></button>
        </div>
      </div>
    </section>

    <footer class="room-footer">
      <span class="filename" id="filename"></span>
      <div class="uploads" id="uploads" hidden>
        <label class="upload" id="filmLabel" title="Upload MP4 or WebM"><input type="file" id="filmFile" accept=".mp4,.webm"><svg aria-hidden="true"><use href="#upload"/></svg>Film</label>
        <label class="upload" id="captionLabel" title="Upload SRT or VTT"><input type="file" id="captionFile" accept=".srt,.vtt" disabled><svg aria-hidden="true"><use href="#cc"/></svg>Captions</label>
      </div>
    </footer>
    <p id="roomMessage" class="message" role="status" hidden></p>
  </main>
</body>
</html>
